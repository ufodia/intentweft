<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 330" role="img" aria-labelledby="title desc">
  <title id="title">The IntentWeft review flow</title>
  <desc id="desc">Five connected stages: define intent, trace evidence, test realistic scenarios, take practical action, and verify what actually ran.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5BCBB8"/>
      <stop offset=".48" stop-color="#7778E8"/>
      <stop offset="1" stop-color="#E2A96F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2B45" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1440" height="330" rx="22" fill="#F8FAFD"/>
  <path d="M82 162H1358" stroke="url(#line)" stroke-width="2" stroke-opacity=".38"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="36" y="56" width="244" height="216" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
      <rect x="324" y="56" width="244" height="216" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
      <rect x="612" y="56" width="244" height="216" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
      <rect x="900" y="56" width="244" height="216" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
      <rect x="1188" y="56" width="244" height="216" rx="18" fill="#FFFFFF" stroke="#E5EAF2"/>
    </g>
    <g fill="none" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M284 164h28m-8-7 8 7-8 7"/>
      <path d="M572 164h28m-8-7 8 7-8 7"/>
      <path d="M860 164h28m-8-7 8 7-8 7"/>
      <path d="M1148 164h28m-8-7 8 7-8 7"/>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="1.8" fill="#71809A">
      <text x="62" y="94">01 / ALIGN</text>
      <text x="350" y="94">02 / TRACE</text>
      <text x="638" y="94">03 / PROBE</text>
      <text x="926" y="94">04 / ACT</text>
      <text x="1214" y="94">05 / VERIFY</text>
    </g>
    <g font-size="20" font-weight="700" fill="#162238">
      <text x="62" y="141">Define intent</text>
      <text x="350" y="141">Trace evidence</text>
      <text x="638" y="141">Test scenarios</text>
      <text x="926" y="141">Take action</text>
      <text x="1214" y="141">Verify results</text>
    </g>
    <g font-size="14" fill="#596780">
      <text x="62" y="180">Name the outcome</text>
      <text x="62" y="202">and its constraints.</text>
      <text x="350" y="180">Connect requirements</text>
      <text x="350" y="202">to current sources.</text>
      <text x="638" y="180">Look for realistic</text>
      <text x="638" y="202">ways it could fail.</text>
      <text x="926" y="180">Make the smallest</text>
      <text x="926" y="202">authorized correction.</text>
      <text x="1214" y="180">Report checks run</text>
      <text x="1214" y="202">and what remains.</text>
    </g>
    <g>
      <rect x="62" y="230" width="52" height="4" rx="2" fill="#5BCBB8"/>
      <rect x="350" y="230" width="52" height="4" rx="2" fill="#69BFC6"/>
      <rect x="638" y="230" width="52" height="4" rx="2" fill="#7778E8"/>
      <rect x="926" y="230" width="52" height="4" rx="2" fill="#A582CF"/>
      <rect x="1214" y="230" width="52" height="4" rx="2" fill="#E2A96F"/>
    </g>
  </g>
</svg>